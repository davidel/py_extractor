# Curated allow-list of well-known packages that are NOT inlined.
#
# Keys are *import names* (the top-level token used in an ``import`` statement),
# NOT PyPI distribution names. Where the two differ we register the import name
# (e.g. ``PIL`` for the ``pillow`` distribution, ``sklearn`` for
# ``scikit-learn``, ``cv2`` for ``opencv-python``).
#
# The Python standard library is handled separately and automatically
# (see ``py_extractor.config.STDLIB_MODULES``); it does not need to be listed.

[packages]
# --- Deep learning / ML frameworks & companions ---
torch = "PyTorch"
torchvision = "torchvision"
torchaudio = "torchaudio"
torchtext = "torchtext"
tensorflow = "TensorFlow"
keras = "Keras"
jax = "JAX"
