name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly at 06:00 UTC: run the network integration suite.
    - cron: "0 6 * * *"

jobs:
  test:
    name: Lint & test (offline)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Formatting (yapf --diff)
        run: yapf --diff --recursive src tests

      - name: Tests (offline, with coverage)
        run: pytest -m "not network" --cov=py_extractor --cov-report=term-missing

  network:
    name: Integration tests (network)
    # Real repositories are only exercised on demand or nightly, never on every
    # push/PR, so transient upstream changes don't block normal development.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests (network)
        run: pytest -m network
